[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarbis-body"
version = "0.3.0"
description = "Jarbis: your Claude Code agent with a body — a face that lives on your desktop, a live session behind it, and a voice you can turn off"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Braian Troncoso" }]
urls.Homepage = "https://github.com/BraianTroncoso/jarbis"

# Linaje: un proyecto MIT anterior (enero 2026). Las capas de audio vienen de
# ahí; el puente y la compuerta son nuevos.
dependencies = [
    "numpy>=1.24.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.0.0",
    # piper-tts venía sin declarar en el proyecto original aunque tts.py lo
    # importaba. Acá está declarado.
    "piper-tts>=1.3.0",
    # El wake word y Silero VAD corren sobre esto.
    "onnxruntime>=1.20.0",
    # El puente.
    "websockets>=14.0",
]

[project.optional-dependencies]
# Presencia por cámara. Opcional: arranca apagado.
presence = ["opencv-python>=4.8.0", "mediapipe>=0.10.0"]
# Hotkey global en Windows.
hotkey = ["keyboard>=0.13.5"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0", "mypy>=1.0.0"]
all = ["jarbis-body[presence,hotkey,dev]"]

[project.scripts]
jarbis-body = "jarbis_body.__main__:main"
jarbis-doctor = "jarbis_body.doctor:main"
jarbis-face = "jarbis_body.face:main"

[tool.hatch.build.targets.wheel]
packages = ["body/jarbis_body"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
